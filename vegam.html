<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vegam Store</title>
  <link rel="stylesheet" href="vegam.css">
</head>
<body>
  <header class="app-header">
    <div class="header-bar">
      <div class="brand">VEGAM</div>
      <label id="menu-toggle" for="menu-toggle-checkbox" class="icon-button menu-button" role="button" aria-label="Open menu">
        <span class="visually-hidden">Open menu</span>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor" />
        </svg>
      </label>
    </div>

    <input id="menu-toggle-checkbox" class="menu-checkbox" type="checkbox" aria-hidden="true" />
    <nav id="main-nav" aria-label="Main navigation" class="menu-closed">
      <button class="menu-item" id="notification-button" data-section="notification">notification</button>
      <button class="menu-item" id="cart-button" data-section="cart">cart</button>
      <button class="menu-item" id="wishlist-button" data-section="wishlist">wishlist</button>
      <button class="menu-item" id="profile-button" data-section="profile">profile</button>
      <button class="menu-item" id="auth-action-button" data-section="login">login</button>
    </nav>
  </header>

  <script>
    // Fallback toggle in case app.js fails to load or initialize
    window.fallbackToggle = function() {
      try {
        const nav = document.getElementById('main-nav');
        const button = document.getElementById('menu-toggle');
        if (!nav || !button) return;

        const isOpen = nav.classList.contains('menu-open');
        if (isOpen) {
          nav.classList.remove('menu-open');
          nav.classList.add('menu-closed');
          button.classList.remove('open');
          nav.style.left = '';
          nav.style.top = '';
          nav.style.right = '';
          return;
        }

        // open: position using viewport coords
        nav.classList.add('menu-open');
        nav.classList.remove('menu-closed');
        nav.style.right = 'auto';
        const btnRect = button.getBoundingClientRect();
        // temporarily ensure nav is visible to measure
        let navRect = nav.getBoundingClientRect();
        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const maxAllowedWidth = Math.max(0, viewportWidth - 16);
        const desiredWidth = Math.min(navRect.width, maxAllowedWidth);
        nav.style.width = desiredWidth + 'px';
        navRect = nav.getBoundingClientRect();
        const leftViewport = btnRect.right - navRect.width;
        const topViewport = btnRect.bottom + 8;
        const minLeft = 8;
        const maxLeft = Math.max(minLeft, viewportWidth - navRect.width - 8);
        const clampedLeft = Math.min(Math.max(minLeft, leftViewport), maxLeft);
        if (clampedLeft >= maxLeft - 1) {
          nav.style.left = '';
          nav.style.right = '8px';
        } else {
          nav.style.left = clampedLeft + 'px';
          nav.style.right = 'auto';
        }
        nav.style.top = topViewport + 'px';
        button.classList.add('open');
          try { button.setAttribute('aria-expanded', 'true'); } catch(e){}
      } catch (e) {
        console.error('fallbackToggle error', e);
      }
    };
  </script>

  <section class="hero">
    <h2>Welcome to Vegam Store</h2>
    <p>Shop your daily essentials at the best prices.</p>
  </section>

  <main>
    <section id="home">
      <h2>Products</h2>
      <div id="product-container" class="grid"></div>
    </section>

    <section id="product-detail" style="display:none;">
      <button class="back-button" onclick="showSection('home')">← Back to products</button>
      <div id="detail-container" class="product-detail"></div>
    </section>

    <section id="cart" style="display:none;">
      <h2>Shopping Cart</h2>
      <div id="cart-container"></div>
      <div id="cart-summary" class="cart-summary"></div>
      <button class="checkout-button" onclick="checkout()">Checkout</button>
    </section>

    <section id="wishlist" style="display:none;">
      <h2>Wishlist</h2>
      <div id="wishlist-container"></div>
    </section>

    <section id="orders" style="display:none;">
      <h2>Order History</h2>
      <div id="orders-container"></div>
    </section>

    <section id="login" style="display:none;">
      <h2>Login</h2>
      <form class="auth-form" onsubmit="login(event)">
        <label>Email</label>
        <input type="email" id="login-email" required />
        <label>Password</label>
        <input type="password" id="login-password" required />
        <button type="submit">Login</button>
      </form>
      <div class="form-message" id="login-message"></div>
      <div class="auth-footer">
        <p>Don't have an account? <a href="#" onclick="showSection('register'); return false;">Register</a></p>
        <p><a href="#" onclick="showSection('forgot-password'); return false;">Forgot password?</a></p>
      </div>
    </section>

    <section id="forgot-password" style="display:none;">
      <h2>Forgot Password</h2>
      <form class="auth-form" onsubmit="forgotPassword(event)">
        <label>Enter your email</label>
        <input type="email" id="forgot-email" required />
        <button type="submit">Reset Password</button>
        <button type="button" onclick="showSection('login')">Back to Login</button>
      </form>
      <div class="form-message" id="forgot-message"></div>
    </section>

    <section id="register" style="display:none;">
      <h2>Register</h2>
      <form class="auth-form" onsubmit="registerUser(event)">
        <label>Name</label>
        <input type="text" id="register-name" required />
        <label>Email</label>
        <input type="email" id="register-email" required />
        <label>Phone</label>
        <input type="tel" id="register-phone" />
        <label>Address</label>
        <input type="text" id="register-address" />
        <label>Password</label>
        <input type="password" id="register-password" required />
        <button type="submit">Register</button>
      </form>
      <div class="form-message" id="register-message"></div>
    </section>

    <section id="profile" style="display:none;">
      <h2>Profile</h2>
      <div class="profile-card">
        <p><strong>Name:</strong> <span id="profile-name"></span></p>
        <p><strong>Email:</strong> <span id="profile-email"></span></p>
        <p><strong>Phone:</strong> <span id="profile-phone"></span></p>
        <p><strong>Address:</strong> <span id="profile-address"></span></p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Vegam Store</p>
  </footer>

  <script src="app.js"></script>
  <script>
    // Ensure menu toggle updates aria-expanded and nav classes (resilient fallback)
    (function(){
      try {
        const menuToggle = document.getElementById('menu-toggle');
        const menuCheckbox = document.getElementById('menu-toggle-checkbox');
        const nav = document.getElementById('main-nav');
        if (!menuToggle) return;
        menuToggle.addEventListener('click', () => {
          // delay to allow checkbox state to update when clicking the label
          setTimeout(() => {
            const expanded = menuCheckbox ? !!menuCheckbox.checked : (menuToggle.getAttribute('aria-expanded') === 'true');
            menuToggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
            if (nav) {
              if (expanded) {
                nav.classList.add('menu-open');
                nav.classList.remove('menu-closed');
              } else {
                nav.classList.remove('menu-open');
                nav.classList.add('menu-closed');
              }
            }
            console.debug('[menuToggle] aria-expanded ->', menuToggle.getAttribute('aria-expanded'));
          }, 0);
        });
      } catch (e) { console.error('menu toggle attach failed', e); }
    })();
  </script>
</body>
</html>
